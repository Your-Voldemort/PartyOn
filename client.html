<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER_STREAM // AUDIO_SYNC</title>

<!-- Brutalist / Y2K / Cyberpunk Aesthetic -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

    :root {
        --bg-color: #050505;
        --grid-color: #111;
        --accent-neon: #00ff41;
        --accent-alert: #ff003c;
        --accent-warning: #fce803;
        --text-main: #e0e0e0;
        --text-dim: #666;
        --border-thick: 4px solid var(--accent-neon);
        --border-thin: 1px solid var(--accent-neon);
        --font-mono: 'Share Tech Mono', monospace;
        --font-display: 'VT323', monospace;
    }

    * {
        box-sizing: border-box;
        cursor: crosshair;
    }

    html, body {
        height: 100%;
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-mono);
        overflow: hidden;
        /* CRT Scanline background */
        background-image: 
            linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
    }

    /* CRT Flicker & Vignette */
    body::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
        pointer-events: none;
        z-index: 999;
    }

    .crt-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        z-index: 998;
        opacity: 0.6;
    }

    /* Layout wrapper */
    .terminal-container {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        z-index: 10;
    }

    /* Main Card / Window */
    .cyber-window {
        width: 100%;
        max-width: 600px;
        background: rgba(5, 5, 5, 0.85);
        border: var(--border-thick);
        box-shadow: 10px 10px 0px rgba(0, 255, 65, 0.2);
        backdrop-filter: blur(4px);
        position: relative;
        animation: glitch-anim-1 4s infinite linear alternate-reverse;
    }

    /* Window Header */
    .window-header {
        background: var(--accent-neon);
        color: var(--bg-color);
        padding: 5px 10px;
        font-family: var(--font-display);
        font-size: 24px;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: var(--border-thick);
    }
    
    .header-glitch {
        animation: blink 2s infinite;
    }

    /* Window Body */
    .window-body {
        padding: 30px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Marquee / Subtext */
    .marquee-container {
        border-bottom: var(--border-thin);
        border-top: var(--border-thin);
        padding: 5px 0;
        overflow: hidden;
        white-space: nowrap;
        color: var(--accent-neon);
        font-size: 14px;
        text-transform: uppercase;
    }

    .marquee-content {
        display: inline-block;
        animation: scrollText 15s linear infinite;
    }

    @keyframes scrollText {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
    }

    /* Buttons */
    .btn-group {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .controls-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .cyber-btn {
        background: transparent;
        color: var(--accent-neon);
        border: var(--border-thin);
        padding: 15px;
        font-family: var(--font-display);
        font-size: 22px;
        text-transform: uppercase;
        letter-spacing: 2px;
        position: relative;
        overflow: hidden;
        transition: all 0.1s steps(2);
        text-align: center;
    }

    .cyber-btn:hover {
        background: var(--accent-neon);
        color: var(--bg-color);
        box-shadow: 4px 4px 0px rgba(0, 255, 65, 0.4);
        transform: translate(-2px, -2px);
    }
    
    .cyber-btn:active {
        transform: translate(2px, 2px);
        box-shadow: none;
    }

    #playBtn {
        border: var(--border-thick);
        font-size: 32px;
        font-weight: bold;
        background: rgba(0, 255, 65, 0.1);
    }

    #playBtn:hover {
        background: var(--accent-neon);
        color: var(--bg-color);
    }

    /* Volume */
    .vol-container {
        display: flex;
        align-items: center;
        gap: 15px;
        border: var(--border-thin);
        padding: 10px;
    }

    .vol-container label {
        color: var(--text-main);
        text-transform: uppercase;
        font-size: 14px;
    }

    input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 10px;
        background: var(--accent-neon);
        cursor: crosshair;
        margin-top: -8px;
        border-radius: 0;
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: crosshair;
        background: var(--text-dim);
    }
    
    input[type=range]:focus {
        outline: none;
    }

    /* Visualizer */
    .vis-container {
        position: relative;
        border: var(--border-thin);
        background: #000;
        padding: 5px;
    }
    
    .vis-container::before {
        content: 'SIG_ANALYSIS';
        position: absolute;
        top: -10px;
        left: 10px;
        background: var(--bg-color);
        padding: 0 5px;
        font-size: 12px;
        color: var(--text-dim);
    }

    #visualizer {
        width: 100%;
        height: 80px;
        display: block;
        /* Using CSS filters to force it into neon green */
        filter: sepia(100%) hue-rotate(70deg) saturate(500%) brightness(120%) contrast(150%);
    }

    /* Stats Area */
    .status-panel {
        border: 1px dashed var(--text-dim);
        padding: 15px;
        font-size: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .status-panel p {
        margin: 0;
    }

    .stat-label {
        color: var(--text-dim);
    }

    .stat-value {
        color: var(--text-main);
    }

    #st {
        color: var(--accent-neon);
        animation: blink 1s step-end infinite;
    }
    
    #st::after {
        content: '_';
    }

    .quality-good { color: var(--accent-neon); }
    .quality-degraded { color: var(--accent-warning); }
    .quality-poor { color: var(--accent-alert); }

    /* Stats Details Hover (Brutalist Tooltip) */
    .stats-area {
        position: relative;
        cursor: help;
    }
    
    .stats-details {
        display: none;
        position: absolute;
        bottom: 110%;
        left: 0;
        width: 100%;
        background: var(--bg-color);
        border: var(--border-thick);
        padding: 10px;
        z-index: 20;
    }
    
    .stats-area:hover .stats-details {
        display: block;
    }
    
    #errorContainer {
        color: var(--accent-alert);
        font-size: 14px;
        margin-top: 10px;
    }
    
    #errorContainer ul {
        list-style-type: square;
        padding-left: 20px;
    }

    /* Footer */
    footer {
        position: fixed;
        bottom: 10px;
        right: 15px;
        z-index: 100;
    }

    .footer-stamp {
        color: var(--text-dim);
        font-size: 12px;
        text-transform: uppercase;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
    }
    
    .footer-stamp a {
        color: var(--text-dim);
        text-decoration: none;
        border-bottom: 1px dotted var(--text-dim);
        transition: color 0.2s;
    }
    
    .footer-stamp a:hover {
        color: var(--accent-neon);
        border-bottom: 1px solid var(--accent-neon);
    }

    /* Animations */
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); }
        20% { clip-path: inset(60% 0 10% 0); }
        40% { clip-path: inset(40% 0 50% 0); }
        60% { clip-path: inset(80% 0 5% 0); }
        80% { clip-path: inset(10% 0 70% 0); }
        100% { clip-path: inset(30% 0 20% 0); }
    }

    /* Stop initial aggressive glitch */
    .cyber-window { animation: none; }
    .cyber-window:hover {
        /* Subtle jitter on hover */
        transform: translate(1px, -1px);
    }
    
    /* Responsive */
    @media (max-width: 500px) {
        .controls-row { grid-template-columns: 1fr; }
        .status-panel { grid-template-columns: 1fr; }
    }
</style>
</head>

<body>
    <div class="crt-overlay"></div>

    <div class="terminal-container">
        
        <div class="cyber-window">
            <div class="window-header">
                <span>[ PARTY_ON_V1.0 ]</span>
                <span class="header-glitch">REC</span>
            </div>

            <div class="window-body">
                
                <div class="marquee-container">
                    <div class="marquee-content">
                        > ESTABLISHING SECURE LAN CONNECTION // > INITIALIZING AUDIO DECODER // > AWAITING USER OVERRIDE // > SYNC PROTOCOL ACTIVE // 
                    </div>
                </div>

                <div class="btn-group">
                    <button id="playBtn" class="cyber-btn" aria-pressed="false" title="Play Stream">
                        [ INITIATE_STREAM ]
                    </button>

                    <div class="controls-row">
                        <button id="pauseBtn" class="cyber-btn" title="Pause">PAUSE</button>      
                        <button id="stopBtn" class="cyber-btn" title="Stop">HALT</button>
                        <button id="muteBtn" class="cyber-btn" title="Mute">MUTE</button>
                    </div>
                </div>

                <div class="vol-container">
                    <label for="volumeSlider">PWR</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="100" aria-label="Volume">
                </div>

                <div class="vis-container">
                    <canvas id="visualizer" width="530" height="80" aria-label="Audio visualization"></canvas>
                </div>

                <div class="status-panel">
                    <div>
                        <span class="stat-label">SYS_STATE:</span> 
                        <span id="st" class="stat-value">STANDBY</span>
                    </div>
                    
                    <div id="statsArea" class="stats-area">
                        <div>
                            <span class="stat-label">DATA_RATE:</span> 
                            <span id="pps" class="stat-value">0</span> <span class="stat-label">PKT/S</span>
                        </div>
                        <div>
                            <span class="stat-label">INTEGRITY:</span> 
                            <span id="quality" class="quality-good">NOMINAL</span>
                        </div>
                        
                        <div id="statsDetails" class="stats-details">
                            <div class="window-header" style="font-size:16px; margin-bottom:10px;">DIAGNOSTICS</div>
                            <div><span class="stat-label">LATENCY:</span> <span id="latency" class="stat-value">--</span></div>
                            <div><span class="stat-label">TOTAL_PKT:</span> <span id="totalPackets" class="stat-value">0</span></div>      
                            <div><span class="stat-label">UNDERRUNS:</span> <span id="underruns" class="stat-value">0</span></div>      
                        </div>
                    </div>
                </div>

                <div id="errorContainer"></div>
            </div>
        </div>

    </div>

    <footer>
        <div class="footer-stamp">
            <span>SYS_ADMIN: <a href="https://github.com/mayurkoli8" target="_blank" rel="noopener noreferrer">MAYUR_KOLI</a></span>
            <span style="font-size: 10px; color: #444;">ID: 9845-XY-LAN</span>
        </div>
    </footer>

    <!-- ES6 Module entry point -->
    <script type="module" src="/static/js/ui.js"></script>
    
    <script>
        // Add subtle interaction effects
        document.addEventListener('DOMContentLoaded', () => {
            const btns = document.querySelectorAll('.cyber-btn');
            btns.forEach(btn => {
                btn.addEventListener('mousedown', () => {
                    document.body.style.backgroundColor = '#1a0505';
                    setTimeout(() => { document.body.style.backgroundColor = ''; }, 50);
                });
            });
            
            // Random glitch effect on the window
            const windowEl = document.querySelector('.cyber-window');
            setInterval(() => {
                if(Math.random() > 0.95) {
                    windowEl.style.animation = 'glitch-anim-1 0.2s cubic-bezier(.25, .46, .45, .94) both infinite';
                    setTimeout(() => {
                        windowEl.style.animation = 'none';
                    }, 200);
                }
            }, 2000);
        });
    </script>
</body>
</html>
